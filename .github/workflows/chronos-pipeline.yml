name: 🚀 Chronos Unified Pipeline (Self-Hosted Runner)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  DATABASE_URL: "file:./ci.db"
  NEXTAUTH_SECRET: "ci-test-secret-key-123456789"
  NEXTAUTH_URL: "http://localhost:5000"

jobs:
  quality-gate:
    name: 🛡️ Quality Gate
    runs-on: self-hosted
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm" # Re-enable cache for npm dependencies

      - name: 📦 Install Dependencies
        run: npm install # Use default install, resolve peer-deps if necessary

      - name: 🏗️ Prisma Generate
        run: npx prisma generate

      - name: 🧹 Lint
        run: npm run lint

      - name: 🎨 Format Check
        run: npm run format:check

      - name: 📐 Type Check
        run: npm run type-check

      - name: 🧪 Unit Tests
        run: npm run test:coverage

      - name: 📤 Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          fail_ci_if_error: false

  security-audit:
    name: 🔒 Security Audit
    runs-on: self-hosted
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm install

      - name: 📋 Audit Dependencies
        run: npm audit --audit-level=high

  deploy-production:
    name: 🌍 Local Deploy (Production)
    runs-on: self-hosted
    needs: [quality-gate, security-audit]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
    steps:
      - name: 🚀 Sincronizar e Reiniciar Produção
        run: |
          set -euo pipefail
          PROD_DIR="/home/nac/ChronosSystem"
          cd "$PROD_DIR"

          # --- Validação de variáveis obrigatórias ---
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "❌ ERRO: DATABASE_URL não configurada."
            echo "   → Acesse: GitHub → Settings → Secrets → Actions"
            echo "   → Adicione: DATABASE_URL=postgresql://user:pass@host:5432/db"
            exit 1
          fi

          if [[ "${DATABASE_URL}" != postgresql://* ]] && [[ "${DATABASE_URL}" != postgres://* ]]; then
            echo "❌ ERRO: DATABASE_URL deve começar com postgresql:// ou postgres://"
            echo "   → Valor atual não suportado pelo Prisma."
            exit 1
          fi

          echo "✅ DATABASE_URL validada (protocolo: $(echo $DATABASE_URL | cut -d: -f1))"

          # --- Grava .env de produção ---
          echo "📝 Atualizando .env de produção..."
          cat > .env << EOF
          DATABASE_URL=${DATABASE_URL}
          NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
          NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:5000}
          EOF

          # --- Atualizar código ---
          echo "📥 Buscando últimas alterações..."
          git fetch origin main
          git reset --hard origin/main

          # --- Dependências e Prisma ---
          echo "📦 Instalando dependências de produção..."
          npm install --omit=dev

          echo "🗄️ Gerando cliente Prisma e Sincronizando Schema..."
          npx prisma generate
          npx prisma migrate deploy || npx prisma db push --accept-data-loss

          # --- Build e Restart ---
          echo "🔨 Compilando aplicação..."
          npm run build

          echo "🚀 Reiniciando serviço..."
          chmod +x ./start-system.sh
          ./start-system.sh

          # --- Cache Redis ---
          echo "🧹 Limpando cache de rate limit..."
          if command -v redis-cli &>/dev/null; then
            redis-cli KEYS "rate_limit:*" | xargs -r redis-cli DEL || true
            echo "✅ Cache Redis limpo"
          else
            echo "⚠️ redis-cli não disponível — expiração natural"
          fi

          echo "✅ Deploy concluído com sucesso!"
