name: 🚀 Chronos Unified Pipeline (Self-Hosted Runner)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  DATABASE_URL: "file:./ci.db"
  NEXTAUTH_SECRET: "ci-test-secret-key-123456789"
  NEXTAUTH_URL: "http://localhost:5000"

jobs:
  quality-gate:
    name: 🛡️ Quality Gate
    runs-on: self-hosted
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm" # Re-enable cache for npm dependencies

      - name: 📦 Install Dependencies
        run: npm install # Use default install, resolve peer-deps if necessary

      - name: 🏗️ Prisma Generate
        run: npx prisma generate

      - name: 🧹 Lint
        run: npm run lint

      - name: 🎨 Format Check
        run: npm run format:check

      - name: 📐 Type Check
        run: npm run type-check

      - name: 🧪 Unit Tests
        run: npm run test:coverage

      - name: 📤 Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          fail_ci_if_error: false

  security-audit:
    name: 🔒 Security Audit
    runs-on: self-hosted
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm install

      - name: 📋 Audit Dependencies
        run: npm audit --audit-level=high

  deploy-production:
    name: 🌍 Local Deploy (Production)
    runs-on: self-hosted
    needs: [quality-gate, security-audit]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production

    steps:
      # ── STEP 1: Validar DATABASE_URL antes de qualquer coisa ──────────────
      - name: 🔍 Validar DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "❌ DATABASE_URL não configurada."
            echo "   → GitHub → Settings → Secrets → Actions → New secret"
            echo "   → Nome: DATABASE_URL"
            echo "   → Valor: postgresql://usuario:senha@localhost:5432/nome_banco"
            exit 1
          fi

          if [[ "${DATABASE_URL}" != postgresql://* ]] && [[ "${DATABASE_URL}" != postgres://* ]]; then
            echo "❌ DATABASE_URL deve começar com postgresql:// ou postgres://"
            exit 1
          fi

          # Extrai host:porta sem expor a senha
          HOSTPORT=$(echo "${DATABASE_URL}" | sed 's|.*@||' | sed 's|/.*||')
          PORTA=$(echo "${HOSTPORT}" | cut -s -d: -f2)
          HOST=$(echo "${HOSTPORT}" | cut -d: -f1)

          echo "🔍 Host detectado : ${HOST}"
          echo "🔍 Porta detectada: ${PORTA:-'(sem porta — padrão 5432)'}"

          # Validar que porta é numérica (se informada)
          if [ -n "${PORTA}" ] && ! [[ "${PORTA}" =~ ^[0-9]+$ ]]; then
            echo ""
            echo "═══════════════════════════════════════════════════════════════"
            echo "❌ PORTA INVÁLIDA: '${PORTA}'"
            echo "═══════════════════════════════════════════════════════════════"
            echo ""
            echo "   CAUSA: a senha no secret DATABASE_URL contém caracteres"
            echo "   especiais NÃO codificados que quebram o parser de URL."
            echo "   O Prisma interpreta parte da senha como o número de porta."
            echo ""
            echo "   SOLUÇÃO: edite o secret e encode os caracteres especiais:"
            echo "   ┌─────────────────────────────────────────┐"
            echo "   │  Caracter  │  Substitua por             │"
            echo "   │     @      │      %40                   │"
            echo "   │     :      │      %3A                   │"
            echo "   │     #      │      %23                   │"
            echo "   │     !      │      %21                   │"
            echo "   │    \$      │      %24                   │"
            echo "   │     /      │      %2F                   │"
            echo "   └─────────────────────────────────────────┘"
            echo ""
            echo "   Exemplo com senha 'minhaS@nha#1':"
            echo "   postgresql://user:minhaS%40nha%231@localhost:5432/db"
            echo ""
            echo "   → GitHub → Settings → Secrets → DATABASE_URL → Update"
            exit 1
          fi

          echo "✅ DATABASE_URL válida"

      # ── STEP 2: Sincronizar código e reiniciar ────────────────────────────
      - name: 🚀 Sincronizar e Reiniciar Produção
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
        run: |
          set -euo pipefail
          cd /home/nac/ChronosSystem

          # Atualizar código PRIMEIRO
          echo "📥 Buscando últimas alterações..."
          git fetch origin main
          git reset --hard origin/main

          # Gravar .env APÓS git reset (evita sobrescrita)
          # printf '%s' não interpreta caracteres especiais do valor
          echo "📝 Gravando .env de produção..."
          {
            printf 'DATABASE_URL=%s\n' "${DATABASE_URL}"
            printf 'NEXTAUTH_SECRET=%s\n' "${NEXTAUTH_SECRET}"
            printf 'NEXTAUTH_URL=%s\n' "${NEXTAUTH_URL:-http://localhost:5000}"
          } > .env
          echo "✅ .env gravado"

          # Dependências
          echo "📦 Instalando dependências..."
          npm install --omit=dev

          # Prisma
          echo "🗄️ Gerando cliente Prisma..."
          npx prisma generate

          echo "🗄️ Aplicando migrations..."
          npx prisma migrate deploy || npx prisma db push --accept-data-loss

          # Build
          echo "🔨 Compilando aplicação..."
          npm run build

          # Restart
          echo "🚀 Reiniciando serviço..."
          chmod +x ./start-system.sh
          ./start-system.sh

          # Redis
          if command -v redis-cli &>/dev/null; then
            redis-cli KEYS "rate_limit:*" | xargs -r redis-cli DEL || true
            echo "✅ Cache Redis limpo"
          fi

          echo "✅ Deploy concluído com sucesso!"
