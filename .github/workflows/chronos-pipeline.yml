name: 🚀 Chronos Unified Pipeline (Self-Hosted Runner)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  quality-gate:
    name: 🛡️ Quality Gate
    runs-on: self-hosted
    env:
      DATABASE_URL: "file:./ci.db"
      NEXTAUTH_SECRET: "ci-test-secret-key-123456789"
      NEXTAUTH_URL: "http://localhost:5000"
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm" # Re-enable cache for npm dependencies

      - name: 📦 Install Dependencies
        run: npm install # Use default install, resolve peer-deps if necessary

      - name: 🏗️ Prisma Generate
        run: npx prisma generate

      - name: 🧹 Lint
        run: npm run lint

      - name: 🎨 Format Check
        run: npm run format:check

      - name: 📐 Type Check
        run: npm run type-check

      - name: 🧪 Unit Tests
        run: npm run test:coverage

      - name: 📤 Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          fail_ci_if_error: false

  security-audit:
    name: 🔒 Security Audit
    runs-on: self-hosted
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm install

      - name: 📋 Audit Dependencies
        run: npm audit --audit-level=high

  deploy-production:
    name: 🌍 Local Deploy (Production)
    runs-on: self-hosted
    needs: [quality-gate, security-audit]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production

    steps:
      # ── STEP 1: Verificar .env pré-configurado no servidor ────────────────
      # Para runners self-hosted, o .env deve existir no servidor.
      # NUNCA sobrescrever via GitHub Secrets — evita corrupção de URL.
      - name: 🔍 Verificar .env no Servidor
        run: |
          ENV_FILE="/home/nac/ChronosSystem/.env"

          if [ ! -f "${ENV_FILE}" ]; then
            echo "❌ .env não encontrado em ${ENV_FILE}"
            echo ""
            echo "   Configure o .env UMA VEZ no servidor de produção:"
            echo "   ─────────────────────────────────────────────────"
            echo "   ssh nac@<servidor>"
            echo "   nano /home/nac/ChronosSystem/.env"
            echo ""
            echo "   Conteúdo mínimo do .env:"
            echo "   DATABASE_URL=postgresql://usuario:senha@localhost:5432/chronos_db"
            echo "   NEXTAUTH_SECRET=chave_aleatoria_longa"
            echo "   NEXTAUTH_URL=http://seu-ip-ou-dominio:5000"
            exit 1
          fi

          # Ler DATABASE_URL do arquivo (sem expor na variável de ambiente do CI)
          DB_URL=$(grep "^DATABASE_URL=" "${ENV_FILE}" | cut -d= -f2- | tr -d '"')

          if [ -z "${DB_URL}" ]; then
            echo "❌ DATABASE_URL não encontrada no .env"
            exit 1
          fi

          if [[ "${DB_URL}" == file:* ]]; then
            echo "❌ DATABASE_URL aponta para SQLite. Configure PostgreSQL no .env"
            exit 1
          fi

          if [[ "${DB_URL}" != postgresql://* ]] && [[ "${DB_URL}" != postgres://* ]]; then
            echo "❌ DATABASE_URL deve começar com postgresql:// ou postgres://"
            echo "   Prefixo atual: $(echo "${DB_URL}" | cut -c1-20)..."
            exit 1
          fi

          # Mostrar host:porta sem expor senha
          HOSTPORT=$(echo "${DB_URL}" | sed 's|.*@||' | sed 's|/.*||')
          echo "✅ .env configurado | Destino PostgreSQL: ${HOSTPORT}"

      # ── STEP 2: Sincronizar código e reiniciar ────────────────────────────
      - name: 🚀 Sincronizar e Reiniciar Produção
        run: |
          set -euo pipefail
          cd /home/nac/ChronosSystem

          # Proteger .env de git reset --hard (apenas marca, não commita)
          git update-index --skip-worktree .env 2>/dev/null || true

          # Atualizar código
          echo "📥 Buscando últimas alterações..."
          git fetch origin main
          git reset --hard origin/main

          # Confirmar que .env sobreviveu ao reset
          SAVED_DB_URL=$(grep "^DATABASE_URL=" .env 2>/dev/null | cut -d= -f2- | tr -d '"')
          if [[ "${SAVED_DB_URL}" != postgresql://* ]] && [[ "${SAVED_DB_URL}" != postgres://* ]]; then
            echo "❌ .env perdido ou DATABASE_URL inválida após git reset"
            echo "   Execute no servidor: git update-index --skip-worktree .env"
            exit 1
          fi
          echo "✅ .env preservado"

          # Dependências
          echo "📦 Instalando dependências..."
          npm install --omit=dev

          # Prisma — garante que DATABASE_URL vem do .env e não de variável de ambiente do CI
          unset DATABASE_URL
          echo "🗄️ Gerando cliente Prisma..."
          npx prisma generate

          echo "🗄️ Aplicando migrations..."
          npx prisma migrate deploy || npx prisma db push --accept-data-loss

          # Build
          echo "🔨 Compilando aplicação..."
          npm run build

          # Restart
          echo "🚀 Reiniciando serviço..."
          chmod +x ./start-system.sh
          ./start-system.sh

          # Redis
          if command -v redis-cli &>/dev/null; then
            redis-cli KEYS "rate_limit:*" | xargs -r redis-cli DEL || true
            echo "✅ Cache Redis limpo"
          fi

          echo "✅ Deploy concluído com sucesso!"
